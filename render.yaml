services:
  - type: web
    name: arav-portfolio
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: aravadmin
      - key: ADMIN_PASSWORD
        value: AravPortfolio-Admin-2026!
